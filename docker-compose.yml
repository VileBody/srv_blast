services:
  orchestrator-api:
    image: ${BLAST_RUNTIME_IMAGE:-blast_final-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: orchestrator-api
    env_file:
      - .env
    environment:
      WORK_DIR: /app/work
      OUTPUT_DIR: /app/output
      PINS_DIR: /app/pins
      DESCRIPTIONS_DIR: /app/descriptions

      # shared artifacts paths
      FOOTAGE_INVENTORY_OUT: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_OUT: /app/pins/descriptions_bundle_selected.json

      # inputs
      FOOTAGE_DIR: /app/footage
      FOOTAGE_DESCRIPTIONS_DIR: /app/descriptions
      STATIC_ASSETS_SOURCE_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_ENRICH_INDEX_JSON: /app/data/static_assets_index_1to1.json
      S3_ASSET_PREFIX: pinterest_collection/pins2_1to1_20260323
      FOOTAGE_S3_PREFLIGHT_MODE: ${FOOTAGE_S3_PREFLIGHT_MODE:-strict}

      # point mlcore to shared paths
      FOOTAGE_INVENTORY_JSON: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_PATH: /app/pins/descriptions_bundle_selected.json
      # /hook/analyze librosa path: disable numba JIT (fork-unsafe gufunc segfault,
      # see worker-build note) + pin native threads. Mirror of worker-build.
      NUMBA_DISABLE_JIT: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      NUMBA_THREADING_LAYER: workqueue
    volumes:
      - ./work:/app/work
      - ./output:/app/output
      - ./out:/app/out
      - ./data:/app/data
      - ./pins:/app/pins
      - ./descriptions:/app/descriptions:ro
      - ./audio:/app/audio:ro
    ports:
      - "${ORCHESTRATOR_API_BIND_HOST:-127.0.0.1}:18000:8000"
    command: >
      bash -lc "python footage_config.py && python -m services.orchestrator.run_uvicorn"
    restart: unless-stopped

  worker-build:
    image: ${BLAST_RUNTIME_IMAGE:-blast_final-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: worker-build
    env_file:
      - .env
    depends_on:
      alignment-api:
        condition: service_healthy
    environment:
      WORK_DIR: /app/work
      OUTPUT_DIR: /app/output
      PINS_DIR: /app/pins
      DESCRIPTIONS_DIR: /app/descriptions

      # shared artifacts paths
      FOOTAGE_INVENTORY_OUT: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_OUT: /app/pins/descriptions_bundle_selected.json

      # inputs
      FOOTAGE_DIR: /app/footage
      FOOTAGE_DESCRIPTIONS_DIR: /app/descriptions
      STATIC_ASSETS_SOURCE_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_ENRICH_INDEX_JSON: /app/data/static_assets_index_1to1.json
      S3_ASSET_PREFIX: pinterest_collection/pins2_1to1_20260323
      FOOTAGE_S3_PREFLIGHT_MODE: ${FOOTAGE_S3_PREFLIGHT_MODE:-strict}

      # point mlcore to shared paths
      FOOTAGE_INVENTORY_JSON: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_PATH: /app/pins/descriptions_bundle_selected.json
      ALIGNMENT_SERVICE_URL: ${ALIGNMENT_SERVICE_URL:-http://alignment-api:8000}
      ALIGNMENT_TIMEOUT_S: ${ALIGNMENT_TIMEOUT_S:-600}
      ALIGNMENT_MODEL_REVISION: ${ALIGNMENT_MODEL_REVISION:-2329100508896c6d9b157019803ab5601e6f3406}
      ALIGNMENT_ALGORITHM_VERSION: local-ctc-viterbi-v12-dynamic-window-redaction-espeak-demucs-4.1.0
      ALIGNMENT_AUDIO_PREPROCESSOR: demucs
      ALIGNMENT_DEMUCS_MODEL_NAME: htdemucs
      ALIGNMENT_DEMUCS_MODEL_REVISION: 8726e21a993978c7ba086d3872e7608d7d5bfca646ca4aca459ffda844faa8b4
      ALIGNMENT_DEMUCS_PACKAGE_VERSION: 4.1.0

      # --- SIGSEGV mitigation for the hook audio analysis (librosa) ---
      # Celery runs prefork (forked children) and the segfault was pinpointed by
      # faulthandler to a numba JIT gufunc dispatch:
      #   numba/np/ufunc/gufunc.py __call__  <-  librosa peak_pick / onset_detect
      # numba's compiled runtime is initialised in the parent and is NOT fork-safe
      # → the gufunc call crashes the child. NUMBA_DISABLE_JIT=1 makes librosa use
      # its pure-NumPy fallbacks (no compiled gufunc, no crash); the perf hit is
      # negligible on the 12-15s focus clip. Thread pins kept for OpenBLAS
      # oversubscription. All must be set in container env (apply before import).
      # NOTE: env changes require a container RECREATE (compose up --force-recreate),
      # not just an image pull, to take effect.
      NUMBA_DISABLE_JIT: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      NUMBA_THREADING_LAYER: workqueue
    volumes:
      - ./work:/app/work
      - ./output:/app/output
      - ./out:/app/out
      - ./data:/app/data
      - ./pins:/app/pins
      - ./descriptions:/app/descriptions:ro
      - ./audio:/app/audio:ro
    command: >
      bash -lc "python footage_config.py && celery -A services.orchestrator.celery_app:celery_app worker -l INFO --concurrency=${WORKER_BUILD_CONCURRENCY:-4} -Q ${CELERY_QUEUE_BUILD:-build}"
    restart: unless-stopped

  alignment-api:
    image: ${BLAST_ALIGNMENT_IMAGE:-blast_final-alignment:local}
    build:
      context: .
      dockerfile: Dockerfile.alignment
      network: host
      args:
        ALIGNMENT_MODEL_REVISION: ${ALIGNMENT_MODEL_REVISION:-2329100508896c6d9b157019803ab5601e6f3406}
        ALIGNMENT_DEMUCS_MODEL_SHA256: 8726e21a993978c7ba086d3872e7608d7d5bfca646ca4aca459ffda844faa8b4
        ALIGNMENT_DEMUCS_PACKAGE_VERSION: 4.1.0
    container_name: alignment-api
    env_file:
      - .env
    environment:
      ALIGNMENT_MODEL_PATH: /opt/models/ru
      ALIGNMENT_MODEL_REVISION: ${ALIGNMENT_MODEL_REVISION:-2329100508896c6d9b157019803ab5601e6f3406}
      ALIGNMENT_AUDIO_PREPROCESSOR: demucs
      ALIGNMENT_DEMUCS_MODEL_REPO: /opt/models/demucs
      ALIGNMENT_DEMUCS_MODEL_NAME: htdemucs
      ALIGNMENT_DEMUCS_MODEL_REVISION: 8726e21a993978c7ba086d3872e7608d7d5bfca646ca4aca459ffda844faa8b4
      ALIGNMENT_DEMUCS_PACKAGE_VERSION: 4.1.0
      ALIGNMENT_DEMUCS_SEGMENT_SEC: ${ALIGNMENT_DEMUCS_SEGMENT_SEC:-7.0}
      ALIGNMENT_DEMUCS_OVERLAP: ${ALIGNMENT_DEMUCS_OVERLAP:-0.25}
      ALIGNMENT_ALLOWED_AUDIO_ROOT: /app/work/jobs
      ALIGNMENT_TIMEOUT_S: ${ALIGNMENT_TIMEOUT_S:-600}
      ALIGNMENT_FFMPEG_TIMEOUT_S: ${ALIGNMENT_FFMPEG_TIMEOUT_S:-120}
      ALIGNMENT_PADDING_LEFT_SEC: ${ALIGNMENT_PADDING_LEFT_SEC:-0.5}
      ALIGNMENT_PADDING_RIGHT_SEC: ${ALIGNMENT_PADDING_RIGHT_SEC:-0.5}
      ALIGNMENT_MIN_WORD_CONFIDENCE: ${ALIGNMENT_MIN_WORD_CONFIDENCE:-0.05}
      ALIGNMENT_PAUSE_MIN_GAP_SEC: ${ALIGNMENT_PAUSE_MIN_GAP_SEC:-0.35}
      ALIGNMENT_DYNAMIC_WINDOW_MAX_ADJUST_SEC: ${ALIGNMENT_DYNAMIC_WINDOW_MAX_ADJUST_SEC:-1.0}
      ALIGNMENT_DYNAMIC_WINDOW_STEP_SEC: ${ALIGNMENT_DYNAMIC_WINDOW_STEP_SEC:-0.25}
      ALIGNMENT_DYNAMIC_WINDOW_MIN_EDGE_CLEARANCE_SEC: ${ALIGNMENT_DYNAMIC_WINDOW_MIN_EDGE_CLEARANCE_SEC:-0.12}
      ALIGNMENT_DYNAMIC_WINDOW_STABILITY_TOLERANCE_SEC: ${ALIGNMENT_DYNAMIC_WINDOW_STABILITY_TOLERANCE_SEC:-0.12}
      ALIGNMENT_DYNAMIC_WINDOW_MIN_CONSENSUS_CANDIDATES: ${ALIGNMENT_DYNAMIC_WINDOW_MIN_CONSENSUS_CANDIDATES:-3}
      ALIGNMENT_DYNAMIC_WINDOW_SCORE_TOLERANCE: ${ALIGNMENT_DYNAMIC_WINDOW_SCORE_TOLERANCE:-0.12}
      ALIGNMENT_DYNAMIC_WINDOW_MIN_BOUNDARY_DURATION_RATIO: ${ALIGNMENT_DYNAMIC_WINDOW_MIN_BOUNDARY_DURATION_RATIO:-0.15}
      ALIGNMENT_MAX_WINDOW_SEC: ${ALIGNMENT_MAX_WINDOW_SEC:-120}
      ALIGNMENT_MAX_REFERENCE_WORDS: ${ALIGNMENT_MAX_REFERENCE_WORDS:-400}
      ALIGNMENT_TORCH_THREADS: ${ALIGNMENT_TORCH_THREADS:-4}
      ALIGNMENT_PRONUNCIATION_MODE: espeak_en_to_ru
      ALIGNMENT_ESPEAK_BIN: espeak-ng
      ALIGNMENT_ESPEAK_VOICE: en-us
      ALIGNMENT_ESPEAK_EXPECTED_VERSION: "1.51"
      ALIGNMENT_ESPEAK_TIMEOUT_S: ${ALIGNMENT_ESPEAK_TIMEOUT_S:-2}
      ALIGNMENT_PRONUNCIATION_OVERRIDES_PATH: /app/config/alignment_pronunciations.json
      OMP_NUM_THREADS: ${ALIGNMENT_TORCH_THREADS:-4}
      MKL_NUM_THREADS: ${ALIGNMENT_TORCH_THREADS:-4}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./work:/app/work:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  worker-render:
    image: ${BLAST_RUNTIME_IMAGE:-blast_final-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: worker-render
    env_file:
      - .env
    environment:
      WORK_DIR: /app/work
      OUTPUT_DIR: /app/output
      PINS_DIR: /app/pins
      DESCRIPTIONS_DIR: /app/descriptions

      # shared artifacts paths
      FOOTAGE_INVENTORY_OUT: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_OUT: /app/pins/descriptions_bundle_selected.json

      # inputs
      FOOTAGE_DIR: /app/footage
      FOOTAGE_DESCRIPTIONS_DIR: /app/descriptions
      STATIC_ASSETS_SOURCE_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_ENRICH_INDEX_JSON: /app/data/static_assets_index_1to1.json
      S3_ASSET_PREFIX: pinterest_collection/pins2_1to1_20260323
      FOOTAGE_S3_PREFLIGHT_MODE: ${FOOTAGE_S3_PREFLIGHT_MODE:-strict}

      # point mlcore to shared paths
      FOOTAGE_INVENTORY_JSON: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_PATH: /app/pins/descriptions_bundle_selected.json
    volumes:
      - ./work:/app/work
      - ./output:/app/output
      - ./out:/app/out
      - ./data:/app/data
      - ./pins:/app/pins
      - ./descriptions:/app/descriptions:ro
      - ./audio:/app/audio:ro
    command: >
      bash -lc "python footage_config.py && celery -A services.orchestrator.celery_app:celery_app worker -l INFO --concurrency=1 -Q ${CELERY_QUEUE_RENDER:-render}"
    restart: unless-stopped

  worker-render-poll:
    image: ${BLAST_RUNTIME_IMAGE:-blast_final-runtime:local}
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: worker-render-poll
    env_file:
      - .env
    environment:
      WORK_DIR: /app/work
      OUTPUT_DIR: /app/output
      PINS_DIR: /app/pins
      DESCRIPTIONS_DIR: /app/descriptions

      # shared artifacts paths
      FOOTAGE_INVENTORY_OUT: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_OUT: /app/pins/descriptions_bundle_selected.json

      # inputs
      FOOTAGE_DIR: /app/footage
      FOOTAGE_DESCRIPTIONS_DIR: /app/descriptions
      STATIC_ASSETS_SOURCE_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_INDEX_JSON: /app/data/static_assets_index_1to1.json
      STATIC_ASSETS_ENRICH_INDEX_JSON: /app/data/static_assets_index_1to1.json
      S3_ASSET_PREFIX: pinterest_collection/pins2_1to1_20260323
      FOOTAGE_S3_PREFLIGHT_MODE: ${FOOTAGE_S3_PREFLIGHT_MODE:-strict}

      # point mlcore to shared paths
      FOOTAGE_INVENTORY_JSON: /app/data/footage_inventory.json
      DESCRIPTIONS_BUNDLE_PATH: /app/pins/descriptions_bundle_selected.json
    volumes:
      - ./work:/app/work
      - ./output:/app/output
      - ./out:/app/out
      - ./data:/app/data
      - ./pins:/app/pins
      - ./descriptions:/app/descriptions:ro
      - ./audio:/app/audio:ro
    command: >
      bash -lc '
        python footage_config.py &&
        render_queue="${CELERY_QUEUE_RENDER:-render}" &&
        poll_queue="${CELERY_QUEUE_RENDER_POLL:-}" &&
        if [ -z "$$poll_queue" ]; then
          case "$$render_queue" in
            render) poll_queue="render-poll" ;;
            render.*) poll_queue="render-poll.$${render_queue#render.}" ;;
            render-*) poll_queue="render-poll-$${render_queue#render-}" ;;
            *) poll_queue="$${render_queue}-poll" ;;
          esac
        fi &&
        celery -A services.orchestrator.celery_app:celery_app worker -l INFO --concurrency=1 -Q "$$poll_queue"
      '
    restart: unless-stopped

  tg-bot:
    image: ${BLAST_TG_BOT_IMAGE:-blast_final-tg-bot:local}
    build:
      context: .
      dockerfile: Dockerfile.tg-bot
      network: host
    container_name: tg-bot
    env_file:
      - .env
    environment:
      # Team/public switches are intentionally independent.
      PHOTO_FLOW_ENABLED: ${PHOTO_FLOW_ENABLED_TEAM:-1}
      TG_BOT_API_ENV: ${TG_BOT_API_ENV:-prod}
      TG_TEST_BOT_TOKEN: ${TG_TEST_BOT_TOKEN:-}
      TG_TEST_CREDITS_DB_URL: ${TG_TEST_CREDITS_DB_URL:-}
      ORCHESTRATOR_PUBLIC_URL: ${ORCHESTRATOR_PUBLIC_URL:-http://orchestrator-api:8000}
      TEAM_LOCAL_ALIGNMENT_ENABLED: ${TEAM_LOCAL_ALIGNMENT_ENABLED:-0}
      BOT_POLL_INTERVAL_S: ${BOT_POLL_INTERVAL_S:-5}
      BOT_TMP_DIR: ${BOT_TMP_DIR:-/app/work/tg_tmp}
      BOT_MAX_AUDIO_MB: ${BOT_MAX_AUDIO_MB:-5}
    volumes:
      - ./work:/app/work
    command: >
      bash -lc "python -m services.tg_bot_botapi.app"
    restart: unless-stopped

  tg-bot-public:
    image: ${BLAST_TG_BOT_PUBLIC_IMAGE:-blast_final-tg-bot-public:local}
    build:
      context: .
      dockerfile: Dockerfile.tg-bot-public
      network: host
    container_name: tg-bot-public
    env_file:
      - .env
    environment:
      # Rolled out 2026-07-28, after the public flow was aligned with footage
      # (subtitle mode -> transition -> stylization -> colours, hooks skipped).
      # Set PHOTO_FLOW_ENABLED_PUBLIC=0 in .env to pull it back without a deploy.
      PHOTO_FLOW_ENABLED: ${PHOTO_FLOW_ENABLED_PUBLIC:-1}
      TG_BOT_API_ENV: ${TG_BOT_API_ENV:-prod}
      TG_BOT_TOKEN: ${TG_BOT_PUBLIC_TOKEN}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:-blast808bot}
      TG_TEST_BOT_TOKEN: ${TG_TEST_BOT_TOKEN:-}
      TG_TEST_BOT_USERNAME: ${TG_TEST_BOT_USERNAME:-}
      TG_TEST_BYPASS_SUBSCRIPTION: ${TG_TEST_BYPASS_SUBSCRIPTION:-0}
      TG_TEST_CREDITS_DB_URL: ${TG_TEST_CREDITS_DB_URL:-}
      TG_TEST_PREVIEW_SOURCE_BOT_TOKEN: ${TG_TEST_PREVIEW_SOURCE_BOT_TOKEN:-}
      TG_PREVIEW_SOURCE_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_STATE_PREFIX: ${TG_PUBLIC_STATE_PREFIX:-blast:tg:public:chat_state}
      SUBSCRIPTION_CHANNEL: ${SUBSCRIPTION_CHANNEL:-@impulsemarketing}
      # Surface the 5-category hook flow + color pickers in the public bot.
      # Default ON; set HOOK_FLOW_ENABLED=0 in .env to hide it again.
      HOOK_FLOW_ENABLED: ${HOOK_FLOW_ENABLED:-1}
      # Maintenance switch for the PUBLIC bot only (orchestrator/internal bot untouched).
      # ON now: bot answers every incoming message with the maintenance stub.
      # To re-enable the bot for everyone: set TG_MAINTENANCE_MODE to "false" and redeploy.
      TG_MAINTENANCE_MODE: ${TG_MAINTENANCE_MODE:-true}
      TG_MAINTENANCE_MESSAGE: ${TG_MAINTENANCE_MESSAGE:-Мы на техработах. Скоро вернемся.}
      # FULL STOP: false = nobody (paying clients included) may generate during maintenance.
      # Set to "true" for the softer mode where paying clients keep generating.
      TG_MAINTENANCE_ALLOW_PAID_CLIENTS: ${TG_MAINTENANCE_ALLOW_PAID_CLIENTS:-false}
      ORCHESTRATOR_PUBLIC_URL: ${ORCHESTRATOR_PUBLIC_URL:-http://orchestrator-api:8000}
      # No user-facing selector in public: every Stage 1 alignment request uses
      # the explicitly configured backend. Keep local_ctc as the production default.
      PUBLIC_STAGE1_ALIGNMENT_BACKEND: ${PUBLIC_STAGE1_ALIGNMENT_BACKEND:-local_ctc}
      BOT_POLL_INTERVAL_S: ${BOT_POLL_INTERVAL_S:-5}
      BOT_STATUS_UPDATE_INTERVAL_S: ${BOT_STATUS_UPDATE_INTERVAL_S:-20}
      TG_DELIVERY_MODE: ${TG_DELIVERY_MODE:-polling}
      TG_WEBHOOK_URL: ${TG_WEBHOOK_URL:-}
      TG_WEBHOOK_SECRET: ${TG_WEBHOOK_SECRET:-}
      TG_WEBHOOK_PATH: ${TG_WEBHOOK_PATH:-/telegram/webhook}
      TG_WEBHOOK_BIND_HOST: ${TG_WEBHOOK_BIND_HOST:-0.0.0.0}
      TG_WEBHOOK_PORT: ${TG_WEBHOOK_PORT:-8081}
      TG_WEBHOOK_DEDUP_TTL_S: ${TG_WEBHOOK_DEDUP_TTL_S:-86400}
      TG_WEBHOOK_IP_ADDRESS: ${TG_WEBHOOK_IP_ADDRESS:-}
      TG_WEBHOOK_DELETE_ON_SHUTDOWN: ${TG_WEBHOOK_DELETE_ON_SHUTDOWN:-0}
      BOT_TMP_DIR: ${BOT_TMP_DIR_PUBLIC:-/app/work/tg_tmp_public}
      BOT_MAX_AUDIO_MB: ${BOT_MAX_AUDIO_MB:-5}
      CREDITS_DB_URL: ${CREDITS_DB_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      ADMIN_PANEL_PORT: ${ADMIN_PANEL_PORT:-8080}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:-changeme}
      INITIAL_CREDITS: ${INITIAL_CREDITS:-2}
      MANAGER_CHAT_ID: ${MANAGER_CHAT_ID:-0}
      ADMIN_PANEL_PUBLIC_URL: ${ADMIN_PANEL_PUBLIC_URL:-}
      SURVEY_URL: ${SURVEY_URL:-https://forms.yandex.ru/u/69c52ce695add5c0264676e3}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_NOTIFY_URL: ${TBANK_NOTIFY_URL:-}
      OFFER_URL: ${OFFER_URL:-}
    volumes:
      - ./work:/app/work
    ports:
      - "${TG_BOT_PUBLIC_RUNTIME_ADMIN_BIND_HOST:-127.0.0.1}:${TG_BOT_PUBLIC_RUNTIME_ADMIN_BIND_PORT:-18182}:${ADMIN_PANEL_PORT:-8080}"
      - "${TG_BOT_PUBLIC_WEBHOOK_BIND_HOST:-127.0.0.1}:${TG_BOT_PUBLIC_WEBHOOK_BIND_PORT:-18083}:${TG_WEBHOOK_PORT:-8081}"
    command: >
      bash -lc "python -m services.tg_bot_public.app"
    restart: unless-stopped

  tg-bot-public-admin:
    profiles:
      - ops
    image: ${BLAST_TG_BOT_PUBLIC_IMAGE:-blast_final-tg-bot-public:local}
    build:
      context: .
      dockerfile: Dockerfile.tg-bot-public
      network: host
    container_name: tg-bot-public-admin
    env_file:
      - .env
    environment:
      TG_BOT_API_ENV: ${TG_BOT_API_ENV:-prod}
      TG_BOT_TOKEN: ${TG_BOT_PUBLIC_TOKEN}
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:-blast808bot}
      TG_TEST_BOT_TOKEN: ${TG_TEST_BOT_TOKEN:-}
      TG_TEST_BOT_USERNAME: ${TG_TEST_BOT_USERNAME:-}
      TG_TEST_BYPASS_SUBSCRIPTION: ${TG_TEST_BYPASS_SUBSCRIPTION:-0}
      TG_TEST_CREDITS_DB_URL: ${TG_TEST_CREDITS_DB_URL:-}
      TG_TEST_PREVIEW_SOURCE_BOT_TOKEN: ${TG_TEST_PREVIEW_SOURCE_BOT_TOKEN:-}
      TG_PREVIEW_SOURCE_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_STATE_PREFIX: ${TG_PUBLIC_STATE_PREFIX:-blast:tg:public:chat_state}
      SUBSCRIPTION_CHANNEL: ${SUBSCRIPTION_CHANNEL:-@impulsemarketing}
      # Surface the 5-category hook flow + color pickers in the public bot.
      # Default ON; set HOOK_FLOW_ENABLED=0 in .env to hide it again.
      HOOK_FLOW_ENABLED: ${HOOK_FLOW_ENABLED:-1}
      ORCHESTRATOR_PUBLIC_URL: ${ORCHESTRATOR_PUBLIC_URL:-}
      TG_FILE_PROXY_URL: ${TG_FILE_PROXY_URL:-}
      CREDITS_DB_URL: ${CREDITS_DB_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
      ADMIN_PANEL_PORT: ${ADMIN_PANEL_PORT:-8080}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:-changeme}
      INITIAL_CREDITS: ${INITIAL_CREDITS:-2}
      MANAGER_CHAT_ID: ${MANAGER_CHAT_ID:-0}
      ADMIN_PANEL_PUBLIC_URL: ${ADMIN_PANEL_PUBLIC_URL:-}
      SURVEY_URL: ${SURVEY_URL:-https://forms.yandex.ru/u/69c52ce695add5c0264676e3}
      TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY:-}
      TBANK_PASSWORD: ${TBANK_PASSWORD:-}
      TBANK_NOTIFY_URL: ${TBANK_NOTIFY_URL:-}
      OFFER_URL: ${OFFER_URL:-}
    volumes:
      - ./work:/app/work
    ports:
      - "${TG_BOT_PUBLIC_ADMIN_BIND_HOST:-127.0.0.1}:${TG_BOT_PUBLIC_ADMIN_BIND_PORT:-18081}:${ADMIN_PANEL_PORT:-8080}"
    command: >
      bash -lc "python -m services.tg_bot_public.admin_only"
    restart: unless-stopped

  asset-ui:
    image: ${BLAST_ASSET_UI_IMAGE:-blast_final-asset-ui:local}
    build:
      context: .
      dockerfile: Dockerfile.asset-ui
      network: host
    container_name: asset-ui
    env_file:
      - .env
    environment:
      ASSET_UI_PORT: ${ASSET_UI_PORT:?ASSET_UI_PORT is required}
      ASSET_UI_UPLOAD_MAX_MB: ${ASSET_UI_UPLOAD_MAX_MB:?ASSET_UI_UPLOAD_MAX_MB is required}
      ASSET_UI_TRASH_PREFIX: ${ASSET_UI_TRASH_PREFIX:?ASSET_UI_TRASH_PREFIX is required}
      ASSET_UI_PRESIGN_TTL_S: ${ASSET_UI_PRESIGN_TTL_S:?ASSET_UI_PRESIGN_TTL_S is required}
    ports:
      - "127.0.0.1:18173:${ASSET_UI_PORT:?ASSET_UI_PORT is required}"
    command: >
      bash -lc "python -m services.asset_ui.run_uvicorn"
    restart: unless-stopped

  finance-bot:
    image: ${BLAST_FINANCE_BOT_IMAGE:-blast_final-finance-bot:local}
    build:
      context: ./finance_bot
      dockerfile: Dockerfile
      network: host
    container_name: finance-bot
    environment:
      DB_PATH: /app/data/finance.db
      GROQ_PROXY: ${GROQ_PROXY:-}
    volumes:
      - ./finance_bot_data:/app/data
    ports:
      - "127.0.0.1:18082:8080"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    profiles:
      - storage
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
    command: server /data --console-address ":9001"
    volumes:
      - ./work/minio-data:/data
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-19100}:9000"
      - "${MINIO_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-19101}:9001"
    restart: unless-stopped
