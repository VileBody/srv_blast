name: Deploy Blast Web Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blast-web-preview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, blast-deploy-infra]
    timeout-minutes: 45
    env:
      BLAST_WEB_SESSION_SECRET: ${{ secrets.BLAST_WEB_PREVIEW_SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment contract
        run: |
          set -euo pipefail
          test -n "$BLAST_WEB_SESSION_SECRET"
          bash -n infra/runners/deploy_web_preview.sh
          docker compose -f web_app/docker-compose.preview.yml config >/dev/null

      - name: Deploy preview
        run: bash infra/runners/deploy_web_preview.sh

      - name: External smoke
        run: |
          set -euo pipefail
          wait_for_content() {
            local url="$1"
            local expected="$2"
            for attempt in $(seq 1 12); do
              if curl -fsS --max-time 15 "$url" | grep -q "$expected"; then
                return 0
              fi
              sleep 5
            done
            echo "external smoke failed: $url" >&2
            return 1
          }
          wait_for_content https://app.blast808.com/healthz '"ok":true'
          wait_for_content https://app.blast808.com/login '<div id="root"></div>'
