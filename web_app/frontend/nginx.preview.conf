# Отдача веб-приложения. Сжатие и кэширование — здесь: внешний nginx хоста только проксирует.
#
# - gzip: JS/CSS/JSON/SVG уходили по сети без сжатия (основной JS ~920 КБ вместо ~280 КБ).
#   Сборка кладёт рядом заранее сжатые .gz (gzip_static) — nginx не тратит CPU на каждый запрос.
# - /bundle/: куски сборки с хэшем содержимого → кэш навсегда. Несуществующий файл — честный 404:
#   раньше SPA-фолбэк отдавал вместо него index.html (200, text/html), и после деплоя открытая
#   вкладка падала на «не удалось загрузить модуль» (так открывался монтажный стол со 2–3 раза).
# - index.html: no-cache — после деплоя браузер сразу видит новые имена кусков.
# - статика из public/ без хэша (шрифты, медиа экрана входа, /assets/ картинки): неделя.

gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json font/ttf;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 220m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /bundle/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* ^/(fonts|media|assets)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
