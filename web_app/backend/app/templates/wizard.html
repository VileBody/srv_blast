{% extends "app_shell.html" %}
{% block app_body %}
<main class="wizard-page" data-project-id="{{ projectId or '' }}">
  <section class="wizard-preview card" id="wizard-preview">
    <div class="phone-preview" id="phone-preview">
      <div class="preview-label">Preview Panel</div>
      <div class="preview-visual" id="preview-visual"><span>♪</span></div>
      <div class="waveform" id="waveform"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </section>
  <section class="wizard-right">
    <div class="stepper card" id="wizard-stepper" aria-label="Этапы генерации"></div>
    <div class="track-bar card">
      <div class="track-info"><img src="/static/assets/cover-placeholder.svg" alt="" /><div><strong id="track-title">Трек не загружен</strong><span id="track-meta">MP3 · 0:00</span></div></div>
      <button class="btn primary" type="button" id="wizard-next">Далее →</button>
    </div>
    <div class="settings-panel card" id="wizard-settings"></div>
  </section>
</main>
{% endblock %}
{% block scripts %}<script>window.__BLAST_PROJECTS__ = {{ projects|tojson }};</script>{% endblock %}
